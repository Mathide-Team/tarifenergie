# UME (Usine Municipale d'Erstein) — TRV local, Tarif Bleu résidentiel (issues
# #321 Base, #322 HC ; phase 2 des ELD, #189). Seul fournisseur du TRV sur le
# territoire des UME (Erstein et environs, ≤ 36 kVA) ; pas de filtre de zone dans
# le moteur (comme GEG #56).
# « Grilles de prix applicables à compter du 1er août 2026 », page 1, recoupées
# avec le texte du PDF le 24/10/2026 : mêmes montants que le TRV local ÉS
# (#72, #190). kWh Base : 0,20006 € pour 3 et 6 kVA, 0,19850 € de 9 à 36 kVA —
# ces puissances Base sont EN EXTINCTION (arrêté du 28/01/2025) : publiées pour
# les contrats en cours, plus proposées à la souscription. HC dès 3 kVA. Tempo
# (#323) non repris : le moteur ne connaît que Base et HC.
