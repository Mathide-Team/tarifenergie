# (12 retenu). Abonnement publié en €/an : abonnement_annuel_ttc, sans division par 12.
# kWh Base : 0,26948 € pour 3 et 6 kVA, 0,26725 € de 9 à 36 kVA. Pas d'HC en 3 kVA.
