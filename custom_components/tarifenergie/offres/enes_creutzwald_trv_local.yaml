# Enes Creutzwald — TRV local, Tarif Bleu résidentiel (issues #275 Base, #276 HC ;
# phase 2 des ELD, #189). Seul fournisseur du TRV sur son réseau (Creutzwald,
# Moselle, ≤ 36 kVA) ; pas de filtre de zone dans le moteur (comme ÉS #72).
# Grilles publiées en images (« Service Base » et « Service Heures creuses / Heures
# pleines », année 2026), lues sur le rendu le 24/10/2026. La date exacte n'est pas
# écrite, mais les prix du kWh sont ceux du barème du 01/08/2026 (mêmes valeurs que
# ÉS). Abonnement + CTA publié en € TTC/an et en € TTC/mois : l'annuel, plus précis,
# est retenu. kWh Base : 0,20006 € pour 3 et 6 kVA, 0,19850 € de 9 à 36 kVA, en
# extinction pour les contrats en cours. HC dès 3 kVA ; l'abonnement HC 3 kVA est
# publié à 184,92 €/an (15,41 €/mois), bien au-dessus des autres ELD : repris tel
# que publié. Grille HC : image séparée particulier_cvs_service_hc_hp2026.jpg.
# Pas de Tempo publié.
