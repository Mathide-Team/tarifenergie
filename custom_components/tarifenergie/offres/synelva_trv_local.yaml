# Synelva — TRV local, Tarif Bleu résidentiel (issues #239 Base, #240 HC ; phase 2
# des ELD, #189). Seul fournisseur du TRV sur son réseau (pays chartrain, Eure-et-
# Loir, ≤ 36 kVA) ; pas de filtre de zone dans le moteur (comme ÉS #72).
# Grille « Tarifs réglementés de vente de l'électricité en vigueur au 1er août
# 2026 », relevée le 24/10/2026 avec pdftotext -layout. Abonnements en € TTC/an.
# kWh TTC 0,02 à 0,03 c€ au-dessus du barème national : la grille indique une accise
# de 3,085 c€/kWh HTVA ; prix repris tels que publiés. kWh Base : 0,2003 € pour 3
# et 6 kVA, 0,1988 € de 9 à 36 kVA (EN EXTINCTION, contrats en cours). HC de 6 à
# 36 kVA, abonnement égal à celui de la Base. EJP et Tempo (#241) non repris : le
# moteur ne connaît que Base et HC.
