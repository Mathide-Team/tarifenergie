# Engie Elec Référence 3 ans (issues #28 Base, #127 HC ; inventaire #6).
# « Offre à prix fixe de la part de l'électricité » (typologie CRE), comme Ohm Fixe
# 2 ans (#38) : seule la fourniture est fixe 3 ans ; l'acheminement suit le TURPE
# et les obligations (CEE, capacité) varient dans la limite d'un plafond.
# Fiche descriptive, grille tarifaire d'octobre 2026, pages 4 et 5 : prix publiés
# en trois parts, TTC « hors évolution des taxes ». Chaque total ci-dessous est la
# somme fourniture + acheminement + obligations (prix à la souscription) :
#   - Base : acheminement CU (sans différenciation temporelle), le cas courant ;
#     fourniture 45,79 €/an et 16,379 c€, CU 5,988 c€, obligations 1,838 c€
#     (3-6 kVA) ou 2,010 c€ (9-36 kVA).
#   - HC : acheminement MUDT (2 plages), le cas courant ; fourniture 45,79 €/an,
#     HP 16,861 / HC 14,321 c€, MUDT HP 6,108 / HC 4,332 c€, obligations 2,030 c€.
#     Pas d'HC en 3 kVA.
# Les options d'acheminement CU4 et MU4 (4 plages saisonnières) ne sont pas reprises.
# Abonnement publié en €/an : abonnement_annuel_ttc (fourniture + acheminement).
