# Soréa (Maurienne) — TRV local, Tarif Bleu résidentiel (issues #318 Base,
# #319 HC ; phase 2 des ELD, #189). Seul fournisseur du TRV dans la vallée de
# la Maurienne (Savoie, ≤ 36 kVA) ; pas de filtre de zone dans le moteur (comme
# GEG #56).
# « Grille de prix […] Applicable au 1er Août 2026 », page 1, recoupée avec le
# texte du PDF le 24/10/2026. Prix publiés en c€ à deux décimales. kWh Base :
# 0,2001 € pour 3 et 6 kVA, 0,1985 € de 9 à 36 kVA — ces puissances sont EN
# EXTINCTION (arrêté du 28/01/2025) : publiées pour les contrats en cours, plus
# proposées à la souscription. HC à partir de 6 kVA, même abonnement qu'en
# Base. Non repris : Tempo (#320, le moteur ne connaît que Base et HC), rabais
# communaux de 5 % (page 2 : Saint-Julien-Montdenis, Saint-Léger,
# Villargondran, Montricher, Valmeinier), majorations hors Linky.
