# GEDIA — All Inclusive GES Électricité (issues #54 Base, #335 HC ; inventaire #6).
# ELD de Dreux (Eure-et-Loir) : offre réservée au territoire du réseau GEDIA, dont
# les heures creuses s'appliquent ; pas de filtre de zone dans le moteur (comme GEG #56).
